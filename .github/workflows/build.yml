name: Build & Release Showroom

on:
  push:
    tags:
      - 'v*' # Only executed when a tag like 'v1.0.0' is added

jobs:
  export:
    name: Export & Release Godot Project
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup builds directory and .gdignore
        run: |
          mkdir -p builds
          touch builds/.gdignore
          touch .gdignore

      - name: Setup & Export with Godot 4.6.1
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_export_templates.tpz
          relative_project_path: './'
          archive_output: true
          use_preset_export_path: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            builds/**/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}